name: CI

on:
  push:
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate city data（数据集校验）
        run: python tests/validate_data.py --all
      - name: Build all cities（构建全部城市 + 城市索引）
        run: python scripts/build.py --all
      - name: Check build output
        run: test -f dist/index.html && test -f dist/beijing.html && ls -lh dist/
